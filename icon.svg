<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- app tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#0f1319" stroke="#243044" stroke-width="6"/>
  <!-- chip body -->
  <rect x="76" y="76" width="104" height="104" rx="18" fill="#141a23" stroke="#38bdf8" stroke-width="10"/>
  <!-- pins: 3 per side -->
  <g fill="#38bdf8">
    <rect x="86"  y="48" width="12" height="18" rx="4"/>
    <rect x="122" y="48" width="12" height="18" rx="4"/>
    <rect x="158" y="48" width="12" height="18" rx="4"/>
    <rect x="86"  y="190" width="12" height="18" rx="4"/>
    <rect x="122" y="190" width="12" height="18" rx="4"/>
    <rect x="158" y="190" width="12" height="18" rx="4"/>
    <rect x="48"  y="86"  width="18" height="12" rx="4"/>
    <rect x="48"  y="122" width="18" height="12" rx="4"/>
    <rect x="48"  y="158" width="18" height="12" rx="4"/>
    <rect x="190" y="86"  width="18" height="12" rx="4"/>
    <rect x="190" y="122" width="18" height="12" rx="4"/>
    <rect x="190" y="158" width="18" height="12" rx="4"/>
  </g>
  <!-- monitoring pulse line across the chip -->
  <polyline points="92,128 114,128 126,98 142,158 154,128 164,128"
            fill="none" stroke="#34d399" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- live dot -->
  <circle cx="164" cy="128" r="8" fill="#34d399"/>
</svg>
